// Garry's Mod touch layout (GDroid). Loaded when there is no saved
// cfg/touch.cfg; the gear (left column) edits and saves touch.cfg. Coordinates
// are screen fractions x1 y1 x2 y2, then r g b a, flags (1 = hidden) and aspect.
//
// Layout and icons (vgui/touch/sb_*) from HL2SB++'s touch controls, adapted to
// GMod: the spawn / context menus, toggles and the "more" row are Lua commands
// (runtime/lua/autorun/client/gmodvr_flat_touch.lua), so they survive the
// editor rewriting touch.cfg and need no sv_cheats or valve.rc aliases.
// GMod additions: console, context menu. Undo and physgun push / pull have no
// buttons by default (undo: keyboard Z / console gmod_undo; custom buttons can add them).
// Arrangement follows the supplied gmod-controls2 layout, with no custom key
// declarations or imported sensitivity settings. The thumb cluster has small
// gaps between fire/use/crouch; the outer bottom-right strip stays free for ammo.
touch_removeall
touch_addbutton "look" "" "_look" 0.500 0.000 1.000 1.000 255 255 255 0 0 1
touch_addbutton "move" "" "_move" 0.000 0.180 0.340 1.000 255 255 255 0 0 1
// top left: "more" (shows cleanup, third person, console, kill)
touch_addbutton "more" "vgui/touch/sb_menuplus" "gmod_touch_more" 0.100 0.010 0.160 0.143333 255 255 255 155 0 1
touch_addbutton "cleanup" "vgui/touch/sb_cleanupg" "gmod_cleanup" 0.160 0.010 0.220 0.143333 255 255 255 155 1 1
touch_addbutton "thirdperson" "vgui/touch/sb_camg" "gmod_touch_thirdperson" 0.220 0.010 0.280 0.143333 255 255 255 155 1 1
touch_addbutton "console" "vgui/touch/showconsole" "toggleconsole" 0.280 0.010 0.340 0.143333 255 255 255 155 1 1
touch_addbutton "kill" "vgui/touch/sb_killg" "kill" 0.340 0.010 0.400 0.143333 255 255 255 155 1 1
// left column: touch editor, context menu
touch_addbutton "edit" "vgui/touch/sb_configg" "touch_enableedit" 0.000 0.180 0.060 0.313333 255 255 255 155 0 1
touch_addbutton "contextmenu" "vgui/touch/sb_toolmenu" "gmod_touch_contextmenu" 0.000 0.320 0.060 0.453333 255 255 255 155 0 1
// left thumb
touch_addbutton "speed" "vgui/touch/sb_rung" "+speed" 0.120 0.750 0.200 0.927778 255 255 255 155 0 1
// bottom row: weapons, pause
touch_addbutton "invprev" "vgui/touch/sb_leftg" "invprev" 0.220 0.840 0.280 0.973333 255 255 255 155 0 1
touch_addbutton "lastinv" "vgui/touch/sb_quicks" "lastinv" 0.280 0.840 0.400 0.973333 255 255 255 155 0 0.5
touch_addbutton "invnext" "vgui/touch/sb_rightg" "invnext" 0.400 0.840 0.460 0.973333 255 255 255 155 0 1
touch_addbutton "pause" "vgui/touch/sb_pauseg" "gameui_activate" 0.500 0.840 0.560 0.973333 255 255 255 155 0 1
// top right: scoreboard, zoom, chat, spawn menu
touch_addbutton "score" "vgui/touch/sb_scoreg" "gmod_touch_scoreboard" 0.740 0.010 0.800 0.143333 255 255 255 155 0 1
touch_addbutton "zoom" "vgui/touch/sb_zoomg" "gmod_touch_zoom" 0.800 0.010 0.880 0.187778 255 255 255 155 0 1
touch_addbutton "chat" "vgui/touch/sb_chatg" "messagemode" 0.880 0.010 0.940 0.143333 255 255 255 155 0 1
touch_addbutton "spawnmenu" "vgui/touch/sb_spawnmenug" "gmod_touch_spawnmenu" 0.940 0.010 1.000 0.143333 255 255 255 155 0 1
// right thumb (the strip below 90% of the height on the right stays free for
// the HL2 ammo panels; touch.cpp TouchMigrateHudOverlap moves old defaults)
touch_addbutton "voice" "vgui/touch/sb_micg" "+voicerecord" 0.580 0.840 0.640 0.973333 255 255 255 155 0 1
touch_addbutton "noclip" "vgui/touch/sb_noclipg" "noclip" 0.760 0.400 0.840 0.577778 255 255 255 155 0 1
touch_addbutton "use" "vgui/touch/sb_handg" "+use" 0.720 0.800 0.800 0.977778 255 255 255 155 0 1
touch_addbutton "flashlight" "vgui/touch/sb_flashg" "impulse 100" 0.920 0.260 1.000 0.437778 255 255 255 155 0 1
touch_addbutton "attack2" "vgui/touch/sb_shootaltg" "+attack2" 0.840 0.350 0.920 0.527778 255 255 255 155 0 1
touch_addbutton "reload" "vgui/touch/sb_reloadg" "+reload" 0.920 0.450 1.000 0.627778 255 255 255 155 0 1
touch_addbutton "attack" "vgui/touch/sb_shootg" "+attack" 0.800 0.530 0.920 0.796667 255 255 255 155 0 1
touch_addbutton "jump" "vgui/touch/sb_jumpg" "+jump" 0.920 0.660 1.000 0.837778 255 255 255 155 0 1
touch_addbutton "duck" "vgui/touch/sb_gc" "+gmod_touch_duck" 0.840 0.800 0.920 0.977778 255 255 255 155 0 1
